services:
  frontend:
    build:
      args:
        VUE_APP_API_URL: http://localhost:8081
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 32M

  backend:
    environment:
      LOG_LEVEL: debug
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  nginx-lb:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
