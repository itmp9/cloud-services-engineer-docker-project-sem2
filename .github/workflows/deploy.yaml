name: Docker Project Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest
        - name: Scan backend image with Trivy
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
            format: table
            exit-code: "0"
            ignore-unfixed: true
            severity: CRITICAL,HIGH
        - name: Scan frontend image with Trivy
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest
            format: table
            exit-code: "0"
            ignore-unfixed: true
            severity: CRITICAL,HIGH

  run-with-docker-compose:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0
      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: momo-store-backend:1.0.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: momo-store-frontend:1.0.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test
        run: |
          curl --fail --show-error http://127.0.0.1/
          curl --fail --show-error http://127.0.0.1:8081/health
          curl --fail --show-error http://127.0.0.1:8081/products

      - name: Show service logs
        if: failure()
        run: docker compose logs
