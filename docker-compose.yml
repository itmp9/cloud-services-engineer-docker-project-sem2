services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine3.23}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29.4-alpine}
        VUE_APP_API_URL: ${VUE_APP_API_URL:-http://localhost:8081}
    image: ${FRONTEND_IMAGE:-momo-store-frontend}:${IMAGE_TAG:-1.0.0}
    user: "101:101"
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.26.4-alpine3.23}
    image: ${BACKEND_IMAGE:-momo-store-backend}:${IMAGE_TAG:-1.0.0}
    user: "65532:65532"
    networks:
      - backend-net
    environment:
      APP_PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORDER_DB_PATH: /data/orders.seq
      ORDER_ID_SECRET_FILE: /run/secrets/order_id_secret
    secrets:
      - source: order_id_secret
        target: order_id_secret
    volumes:
      - order-data:/data
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  nginx-lb:
    image: ${FRONTEND_IMAGE:-momo-store-frontend}:${IMAGE_TAG:-1.0.0}
    user: "101:101"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend-net
      - edge-net
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.10"
          memory: 32M

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  edge-net:
    driver: bridge

volumes:
  order-data:
    driver: local

secrets:
  order_id_secret:
    file: ${ORDER_ID_SECRET_FILE:-./secrets/order_id_secret.example}
